spring.application.name=productservice

productservice.type=fakeStoreProductService
server.port=3000
#disable stacktrace in response
server.error.include-stacktrace=never

# FakeStore
fakestore.api.url=https://fakestoreapi.com
fakestore.api.paths.products=/products

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.datasource.url=jdbc:h2:mem:productservice;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.driver-class-name=org.h2.Driver


#FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true